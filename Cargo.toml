[package]
name = "beforeit"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Unofficial Rust port of BeforeIT.jl, the Julia implementation of the agent-based macroeconomic model of Poledna, Miess, Hommes and Rabitsch (2023)"
license = "Apache-2.0"
repository = "https://github.com/ramonfueglister/port-beforeit"
readme = "README.md"
keywords = ["agent-based-model", "macroeconomics", "economics", "simulation", "forecasting"]
categories = ["simulation", "science"]
include = ["src/**", "data/**", "tests/**", "examples/**", "README.md", "LICENSE", "NOTICE", "CITATION.cff"]
publish = false

[features]
# The plots of BeforeIT's package extension ext/BeforeITPlots, drawn as SVG.
plots = ["dep:plotters"]

[dependencies]
libm = "0.2.16"
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
plotters = { version = "0.3.7", default-features = false, features = ["svg_backend"], optional = true }

# The examples of BeforeIT.jl (examples/); those that draw plots need the
# feature plots.
[[example]]
name = "basic_example"
required-features = ["plots"]

[[example]]
name = "basic_example_multibank"
required-features = ["plots"]

[[example]]
name = "basic_inheritance"
required-features = ["plots"]

[[example]]
name = "change_expectations"
required-features = ["plots"]

[[example]]
name = "scenario_analysis_via_overload"
required-features = ["plots"]

[[example]]
name = "scenario_analysis_via_shock"
required-features = ["plots"]

[[example]]
name = "canvas_extension"
required-features = ["plots"]

[[example]]
name = "conditional_forecasts"
required-features = ["plots"]
