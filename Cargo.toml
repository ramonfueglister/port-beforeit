[package]
name = "beforeit"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Unofficial Rust port of BeforeIT.jl, the Julia implementation of the agent-based macroeconomic model of Poledna, Miess, Hommes and Rabitsch (2023)"
license = "Apache-2.0"
repository = "https://github.com/ramonfueglister/port-beforeit"
readme = "README.md"
keywords = ["agent-based-model", "macroeconomics", "economics", "simulation", "forecasting"]
categories = ["simulation", "science"]
include = ["src/**", "data/**", "tests/**", "examples/**", "benchmark/**", "README.md", "LICENSE", "NOTICE", "CITATION.cff"]
publish = false

[features]
# The plots of BeforeIT's package extension ext/BeforeITPlots, drawn as SVG.
plots = ["dep:plotters"]

[dependencies]
libm = "0.2.16"
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
plotters = { version = "0.3.7", default-features = false, features = ["svg_backend"], optional = true }

# The examples of BeforeIT.jl (examples/) and its script main.jl; those
# that draw plots need the feature plots.
[[example]]
name = "main"
required-features = ["plots"]

[[example]]
name = "basic_example"
required-features = ["plots"]

[[example]]
name = "basic_example_multibank"
required-features = ["plots"]

[[example]]
name = "basic_inheritance"
required-features = ["plots"]

[[example]]
name = "change_expectations"
required-features = ["plots"]

[[example]]
name = "scenario_analysis_via_overload"
required-features = ["plots"]

[[example]]
name = "scenario_analysis_via_shock"
required-features = ["plots"]

[[example]]
name = "canvas_extension"
required-features = ["plots"]

[[example]]
name = "conditional_forecasts"
required-features = ["plots"]

[[example]]
name = "prediction_pipeline"
required-features = ["plots"]

[[example]]
name = "prediction_pipeline_multiple"
required-features = ["plots"]

[[example]]
name = "compare_model_vs_real"
required-features = ["plots"]

[[example]]
name = "benchmark_w_matlab"
required-features = ["plots"]

[[example]]
name = "simulate_and_create_tables"
path = "examples/analysis/tabs/simulate_and_create_tables.rs"

[[example]]
name = "simulate_and_create_tables_multicountry"
path = "examples/analysis/tabs/simulate_and_create_tables_multicountry.rs"

[[example]]
name = "tabs_aggregate_forecast_results"
path = "examples/analysis/tabs/aggregate_forecast_results.rs"

[[example]]
name = "figs_aggregate_forecast_results"
path = "examples/analysis/figs/aggregate_forecast_results.rs"
